services:
  - type: web
    name: sih-block-planner
    runtime: node
    plan: free
    region: singapore # or frankfurt, oregon, ohio
    buildCommand: npm run render-build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CACHE_CAPACITY
        value: 100
      # Optional: Link to a Render Managed PostgreSQL DB if created
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: railway-db
      #     property: connectionString

# Optional: Free PostgreSQL Database on Render
# databases:
#   - name: railway-db
#     databaseName: railway_planner
#     user: postgres
#     plan: free
